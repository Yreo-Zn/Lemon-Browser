<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemon Assistant</title>
    <link rel="stylesheet" href="assistant.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="assistant-container">
        <div class="assistant-bar">
            <img src="Icon.png" alt="Lemon Logo" id="assistant-logo">
            <input type="text" id="assistant-input" placeholder="Pregúntale algo a Lemon..." autocomplete="off">
            <button id="mic-button" title="Usar micrófono">
                <i class="fas fa-microphone"></i>
            </button>
            <button id="send-button" title="Enviar consulta">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
    <script src="assistant.js"></script>
</body>
</html>
